<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Feedback</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Deixe seu Feedback</h1>
        <form action="/api/feedbacks/enviar" method="POST">
            <label for="nome"><strong>Nome:</strong></label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            
            <label for="comentario"><strong>Comentário:</strong></label>
            <textarea id="comentario" name="comentario" rows="4" placeholder="O que achou do curso?" required></textarea>
            
            <button type="submit">Enviar Feedback</button>
        </form>
    </div>
</body>
</html>
